<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script type="importmap">
{ "imports": { "three": "../../vendor/three/build/three.module.js", "three/addons/": "../../vendor/three/examples/jsm/" } }
</script>
<title>KAIJU — prototype visuel</title>
<style>
  :root { font-family: 'Inter', system-ui, sans-serif; background: #0B0E12; color: #E7EBEF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0B0E12; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: fixed; left: 18px; right: 18px; top: 16px; display: flex; justify-content: space-between; gap: 18px; pointer-events: none; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 8px; font-weight: 900; }
  h1 span { color: #D93432; }
  p { margin: 6px 0 0; max-width: 520px; color: #AAB2BA; font-size: 13px; line-height: 1.45; }
  a { pointer-events: auto; color: #E7EBEF; font-size: 12px; letter-spacing: 1px; }
  .status { position: fixed; left: 18px; bottom: 16px; letter-spacing: 2px; font-size: 11px; color: #6E7780; text-transform: uppercase; }
  .status.ok { color: #4FAE6B; }
</style>
</head>
<body>
<div class="hud">
  <div>
    <h1>KA<span>IJU</span></h1>
    <p>Prototype visuel. Mechas et créature CC0 Quaternius, chargés en GLB. Ce n'est pas le bestiaire du jeu, et les trois boutons de sorts ne sont pas encore là : ce seront des emplacements, pas des sorts écrits d'avance.</p>
  </div>
  <a href="../../index.html">← IRONGRADE</a>
</div>
<div class="status" id="status">chargement des modèles</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const LOCAL = '../../assets/';
const status = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B0E12);
scene.fog = new THREE.Fog(0x0B0E12, 18, 42);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 80);
camera.position.set(0, 4.2, 16);
camera.lookAt(0, 1.4, 0);

scene.add(new THREE.HemisphereLight(0x9bb0c4, 0x1a120e, 0.85));
const key = new THREE.DirectionalLight(0xffe2c4, 1.6);
key.position.set(6, 10, 4);
scene.add(key);
const rim = new THREE.DirectionalLight(0xD93432, 0.55);
rim.position.set(-6, 3, -4);
scene.add(rim);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(16, 48),
  new THREE.MeshStandardMaterial({ color: 0x14181e, roughness: 0.92, metalness: 0.08 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

function measure(root){
  root.updateMatrixWorld(true);
  root.traverse(o => { if (o.isSkinnedMesh && o.skeleton) o.skeleton.update(); });
  return new THREE.Box3().setFromObject(root);
}
function fit(root, height, x){
  const box = measure(root);
  const size = box.getSize(new THREE.Vector3());
  const scale = height / (size.y || 1);
  root.scale.multiplyScalar(scale);
  const placed = measure(root);
  const center = placed.getCenter(new THREE.Vector3());
  root.position.x += x - center.x;
  root.position.y -= placed.min.y;
  root.position.z -= center.z;
}

const loader = new GLTFLoader();
const mixers = [];
function load(url, height, x){
  return new Promise((resolve, reject) => {
    loader.load(url, gltf => {
      const root = gltf.scene;
      fit(root, height, x);
      scene.add(root);
      if (gltf.animations && gltf.animations.length){
        const mixer = new THREE.AnimationMixer(root);
        mixer.clipAction(gltf.animations[0]).play();
        mixers.push(mixer);
      }
      resolve(root);
    }, undefined, reject);
  });
}

Promise.all([
  load(LOCAL + 'league/George.glb', 3.2, -1.6),
  load(LOCAL + 'creatures/Trex.glb', 4.6, 2.4),
]).then(() => {
  status.textContent = 'CC0 Quaternius — George + Trex, remplaçables';
  status.classList.add('ok');
}).catch(err => {
  status.textContent = 'modèle indisponible';
  console.error(err);
});

const clock = new THREE.Clock();
let yaw = 0;
addEventListener('pointermove', e => { if (e.buttons) yaw += e.movementX * 0.005; });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
function frame(){
  const dt = clock.getDelta();
  mixers.forEach(m => m.update(dt));
  const t = clock.elapsedTime;
  camera.position.x = Math.sin(yaw + t * 0.08) * 16;
  camera.position.z = Math.cos(yaw + t * 0.08) * 16;
  camera.position.y = 4.2;
  camera.lookAt(0.4, 1.8, 0);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
